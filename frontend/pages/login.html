<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MediaMerge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('mm_theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../">
  <main class="auth-page"><div class="auth-box">
    <a class="brand" href="../index.html"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="3"/><path d="m10 8.5 5 3.5-5 3.5z"/></svg></span><span>Media<b>Merge</b></span></a>
    <div class="card-mm">
      <h1>Welcome Back</h1><p class="sub">Sign in to continue to MediaMerge</p>
      <form id="login-form">
        <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" placeholder="Enter your email" required></div>
        <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" placeholder="Enter your password" required></div>
        <div class="row-between"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
        <p class="form-msg" id="form-msg"></p>
        <button class="btn-mm full" type="submit">Login</button>
      </form>
      <div class="alt">Don't have an account? <a href="signup.html">Sign Up</a></div>
    </div>
    <a class="back-home" href="../index.html">&larr; Back to MediaMerge</a>
  </div></main>
  <script src="../js/script.js"></script>
</body>
</html>
